name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System and real-network tests
        env:
          PYTHONPATH: src
          TRACEFORGE_NETWORK_TESTS: '1'
        run: python -m unittest discover -s tests -v
      - name: Reproduce offline benchmark
        env:
          PYTHONPATH: src
        run: python -m traceforge --db data/ci.db demo --output data/ci-report.json
      - name: Compile Python and check JavaScript
        run: |
          python -m compileall -q src tests
          node --check src/traceforge/static/app.js
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-python-${{ matrix.python }}
          path: data/ci-report.json
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional UI test dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise live and recorded dashboards
        run: npm run test:ui
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: artifacts/
          retention-days: 30
